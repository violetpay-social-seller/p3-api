spring:
  application:
    name: p3-api

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:p3}
    username: ${POSTGRES_USER:p3}
    password: ${POSTGRES_PASSWORD:p3}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      ssl:
        enabled: ${REDIS_SSL:false}

  cloud:
    aws:
      region:
        static: ap-northeast-2
      credentials:
        access-key: dummy
        secret-key: dummy
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI}
p3:
  cors:
    allowed-origins: ${P3_CORS_ALLOWED_ORIGINS:http://localhost:3000}

  websocket:
    allowed-origins: ${P3_WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3000}

  asset:
    storage:
      original-asset-bucket: p3-s3-original-dev
      processed-asset-bucket: p3-s3-processed-dev
    delivery:
      base-url: ${P3_DELIVERY_BASE_URL:}
