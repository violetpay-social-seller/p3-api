spring:
  application:
    name: p3-api

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:p3}
    username: ${POSTGRES_USER:p3}
    password: ${POSTGRES_PASSWORD:p3}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      ssl:
        enabled: ${REDIS_SSL:false}

  cloud:
    aws:
      region:
        static: ${AWS_REGION:ap-northeast-2}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI}

management:
  endpoint:
    health:
      probes:
        enabled: true

p3:
  cors:
    allowed-origins: ${P3_CORS_ALLOWED_ORIGINS:http://localhost:3000}

  websocket:
    allowed-origins: ${P3_WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3000}

  web:
    base-url: ${P3_WEB_BASE_URL:http://localhost:3000}

  internal:
    auth:
      token: ${P3_INTERNAL_AUTH_TOKEN:}

  asset:
    storage:
      original-asset-bucket: p3-s3-original-dev
      processed-asset-bucket: p3-s3-processed-dev
    delivery:
      base-url: ${P3_DELIVERY_BASE_URL:}

  point3:
    api-base-url: ${P3_POINT3_API_BASE_URL:https://api.point3.io}
    auth-base-url: ${P3_POINT3_AUTH_BASE_URL:https://pay.point3.io}
    payment-origin: ${P3_POINT3_PAYMENT_ORIGIN:https://pay.point3.io}
    client-id: ${P3_POINT3_CLIENT_ID:}
    api-token: ${P3_POINT3_API_TOKEN:}
    session-ttl: ${P3_POINT3_SESSION_TTL:PT24H}
